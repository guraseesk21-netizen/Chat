<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body, html { height: 100%; background-color: #0b141a; color: #e9edef; overflow: hidden; }
    .app-container { width: 100%; height: 100vh; display: flex; flex-direction: column; }

    /* HEADER */
    .header-bar { background-color: #202c33; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; }
    .header-left { display: flex; align-items: center; gap: 15px; }
    .app-title { font-size: 20px; font-weight: bold; color: #00a884; }
    .header-icons { display: flex; gap: 20px; color: #aebac1; font-size: 18px; }
    
    /* VISTA CONTATTI */
    .contacts-list { flex: 1; overflow-y: auto; background-color: #111b21; }
    .contact { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #222d34; cursor: pointer; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; background-color: #6b7c85; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; }
    .contact-info { flex: 1; }
    .contact-name { font-weight: bold; }
    .contact-msg { font-size: 13px; color: #8696a0; margin-top: 2px; }

    /* VISTA CHAT */
    .chat-container { flex: 1; display: none; flex-direction: column; background-color: #0b141a; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
    .msg.sent { background-color: #005c4b; align-self: flex-end; }
    .msg.received { background-color: #202c33; align-self: flex-start; }
    
    /* INPUT BAR */
    .input-bar { background-color: #202c33; padding: 10px; display: flex; align-items: center; gap: 10px; }
    .input-bar input { flex: 1; background: #2a3942; border: none; padding: 10px; border-radius: 20px; color: white; outline: none; }
    .send-btn { color: #00a884; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header App -->
  <div class="header-bar" id="appHeader">
    <div class="header-left">
      <i class="fa-solid fa-arrow-left" id="backBtn" style="display:none;" onclick="goHome()"></i>
      <span class="app-title" id="headerTitle">Chat App</span>
    </div>
    <div class="header-icons" id="mainIcons">
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
    <div class="header-icons" id="chatIcons" style="display:none;">
      <i class="fa-solid fa-video"></i>
      <i class="fa-solid fa-phone"></i>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
  </div>

  <!-- Lista Contatti -->
  <div class="contacts-list" id="contactsView">
    <div class="contact" onclick="openChat('Koharu Fuyutsuki', 'KF', '#3b5998')">
      <div class="avatar" style="background:#3b5998">KF</div>
      <div class="contact-info">
        <div class="contact-name">Koharu Fuyutsuki</div>
        <div class="contact-msg">Sì, esatto.</div>
      </div>
    </div>
    <div class="contact" onclick="openChat('Marco', 'M', '#2e7d32')">
      <div class="avatar" style="background:#2e7d32">M</div>
      <div class="contact-info">
        <div class="contact-name">Marco</div>
        <div class="contact-msg">Ci vediamo domani!</div>
      </div>
    </div>
  </div>

  <!-- Finestra Chat -->
  <div class="chat-container" id="chatView">
    <div class="chat-messages" id="messagesArea"></div>
    <div class="input-bar">
      <i class="fa-regular fa-face-smile" style="color:#8696a0; font-size:20px;"></i>
      <input type="text" id="msgInput" placeholder="Messaggio">
      <i class="fa-solid fa-paper-plane send-btn" onclick="sendMsg()"></i>
    </div>
  </div>
</div>

<script>
  function openChat(name, avatar, color) {
    document.getElementById('contactsView').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
    document.getElementById('headerTitle').innerText = name;
    document.getElementById('backBtn').style.display = 'block';
    document.getElementById('mainIcons').style.display = 'none';
    document.getElementById('chatIcons').style.display = 'flex';
    document.getElementById('messagesArea').innerHTML = '<div class="msg received">Ciao! Benvenuto nella chat con ' + name + '</div>';
  }

  function goHome() {
    document.getElementById('contactsView').style.display = 'block';
    document.getElementById('chatView').style.display = 'none';
    document.getElementById('headerTitle').innerText = 'Chat App';
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('mainIcons').style.display = 'flex';
    document.getElementById('chatIcons').style.display = 'none';
  }

  function sendMsg() {
    let input = document.getElementById('msgInput');
    if(input.value.trim() !== "") {
      let msg = document.createElement('div');
      msg.className = 'msg sent';
      msg.innerText = input.value;
      document.getElementById('messagesArea').appendChild(msg);
      input.value = "";
    }
  }
</script>
</body>
</html>
