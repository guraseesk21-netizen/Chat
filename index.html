<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body, html { height: 100%; background-color: #0b141a; color: #e9edef; overflow: hidden; }

    /* Struttura principale */
    .app-container { width: 100%; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* HEADER */
    .header-bar { background-color: #202c33; height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; flex-shrink: 0; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .app-title { font-size: 20px; font-weight: 700; color: #00a884; }
    .chat-user-title { font-size: 16px; font-weight: 600; }
    .back-btn { color: #aebac1; font-size: 18px; cursor: pointer; }
    .header-icons { display: flex; gap: 20px; color: #aebac1; font-size: 18px; }

    /* VISTA CONTATTI */
    .contacts-list { flex: 1; overflow-y: auto; background-color: #111b21; width: 100%; }
    .contact { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #222d34; cursor: pointer; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 15px; flex-shrink: 0; }
    .contact-info { flex: 1; overflow: hidden; }
    .contact-top { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .contact-name { font-weight: 600; }
    .contact-time { font-size: 12px; color: #8696a0; }
    .contact-msg { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* VISTA CHAT */
    .chat-container { display: none; flex-direction: column; flex: 1; background-color: #0b141a; overflow: hidden; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
    .msg.sent { background-color: #005c4b; align-self: flex-end; }
    .msg.received { background-color: #202c33; align-self: flex-start; }
    .msg-time { font-size: 10px; color: #8696a0; text-align: right; margin-top: 3px; }

    /* BARRA INPUT (Ora forzata in fondo) */
    .input-bar { background-color: #202c33; padding: 10px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; height: 60px; }
    .input-bar input { flex: 1; background: #2a3942; border: none; padding: 10px 15px; border-radius: 20px; color: white; outline: none; }
    .send-btn { color: #00a884; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header-bar">
    <div class="header-left">
      <i class="fa-solid fa-arrow-left back-btn" id="backBtn" style="display:none;" onclick="goHome()"></i>
      <span class="app-title" id="appTitle">Chat</span>
      <span class="chat-user-title" id="chatTitle" style="display:none;"></span>
    </div>
    <div class="header-icons" id="mainIcons">
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
    <div class="header-icons" id="chatIcons" style="display:none;">
      <i class="fa-solid fa-video"></i>
      <i class="fa-solid fa-phone"></i>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
  </div>

  <div class="contacts-list" id="contactsView"></div>

  <div class="chat-container" id="chatView">
    <div class="chat-messages" id="messagesArea"></div>
    <div class="input-bar">
      <i class="fa-regular fa-face-smile" style="color:#8696a0; font-size:20px;"></i>
      <input type="text" id="msgInput" placeholder="Messaggio" onkeypress="handleKeyPress(event)">
      <i class="fa-solid fa-paper-plane send-btn" onclick="sendMsg()"></i>
    </div>
  </div>
</div>

<script>
  let activeKey = null;
  const chatData = {
    koharu: { name: "Koharu Fuyutsuki", avatar: "KF", bg: "#3b5998", time: "21:12", messages: [{text: "Ehi, ci sei?", time: "20:10", type: "received"}, {text: "Sì, dimmi pure!", time: "20:12", type: "sent"}, {text: "Sì, esatto.", time: "21:12", type: "received"}] },
    marco: { name: "Marco", avatar: "M", bg: "#2e7d32", time: "18:30", messages: [{text: "Ci vediamo domani!", time: "18:30", type: "received"}] },
    sofia: { name: "Sofia", avatar: "S", bg: "#8e24aa", time: "17:45", messages: [{text: "Vieni in biblioteca?", time: "15:00", type: "received"}] },
    alessandro: { name: "Alessandro", avatar: "A", bg: "#d32f2f", time: "16:20", messages: [{text: "Stasera partita?", time: "14:00", type: "received"}] },
    elena: { name: "Elena", avatar: "E", bg: "#f57c00", time: "15:10", messages: [{text: "Hai comprato i pennarelli?", time: "14:50", type: "received"}] },
    luca: { name: "Luca", avatar: "L", bg: "#0097a7", time: "14:00", messages: [{text: "A che ora parte il bus?", time: "13:30", type: "received"}] },
    giulia: { name: "Giulia", avatar: "G", bg: "#c2185b", time: "Ieri", messages: [{text: "Auguri!! 🎉", time: "09:00", type: "received"}] },
    davide: { name: "Davide", avatar: "D", bg: "#512da8", time: "Ieri", messages: [{text: "Visto il finale?", time: "22:00", type: "received"}] },
    chiara: { name: "Chiara", avatar: "C", bg: "#00796b", time: "05/08", messages: [{text: "Partita a scacchi?", time: "16:00", type: "received"}] },
    matteo: { name: "Matteo", avatar: "M", bg: "#455a64", time: "03/08", messages: [{text: "Risolto il bug?", time: "11:00", type: "received"}] }
  };

  function renderContacts() {
    const list = document.getElementById("contactsView");
    list.innerHTML = "";
    Object.keys(chatData).forEach(key => {
      const c = chatData[key];
      const div = document.createElement("div");
      div.className = "contact";
      div.onclick = () => openChat(key);
      div.innerHTML = `<div class="avatar" style="background:${c.bg}">${c.avatar}</div><div class="contact-info"><div class="contact-top"><span class="contact-name">${c.name}</span><span class="contact-time">${c.time}</span></div><div class="contact-msg">${c.messages[c.messages.length-1].text}</div></div>`;
      list.appendChild(div);
    });
  }

  function openChat(key) {
    activeKey = key;
    document.getElementById("contactsView").style.display = "none";
    document.getElementById("chatView").style.display = "flex";
    document.getElementById("appTitle").style.display = "none";
    document.getElementById("chatTitle").style.display = "inline";
    document.getElementById("chatTitle").innerText = chatData[key].name;
    document.getElementById("backBtn").style.display = "block";
    document.getElementById("mainIcons").style.display = "none";
    document.getElementById("chatIcons").style.display = "flex";
    renderMessages();
  }

  function renderMessages() {
    const area = document.getElementById("messagesArea");
    area.innerHTML = "";
    chatData[activeKey].messages.forEach(m => {
      const div = document.createElement("div");
      div.className = `msg ${m.type}`;
      div.innerHTML = `${m.text} <div class="msg-time">${m.time}</div>`;
      area.appendChild(div);
    });
    area.scrollTop = area.scrollHeight;
  }

  function goHome() {
    document.getElementById("contactsView").style.display = "block";
    document.getElementById("chatView").style.display = "none";
    document.getElementById("appTitle").style.display = "inline";
    document.getElementById("chatTitle").style.display = "none";
    document.getElementById("backBtn").style.display = "none";
    document.getElementById("mainIcons").style.display = "flex";
    document.getElementById("chatIcons").style.display = "none";
  }

  function sendMsg() {
    const input = document.getElementById("msgInput");
    if (input.value.trim() !== "") {
      chatData[activeKey].messages.push({text: input.value, time: "Ora", type: "sent"});
      input.value = "";
      renderMessages();
    }
  }

  function handleKeyPress(e) { if (e.key === 'Enter') sendMsg(); }

  renderContacts();
</script>
</body>
</html>
