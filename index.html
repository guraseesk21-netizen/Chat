<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      background-color: #0b141a;
      color: #e9edef;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    .header-bar {
      background-color: #202c33;
      height: 60px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 10;
      border-bottom: 1px solid #111b21;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title {
      font-size: 20px;
      font-weight: 700;
      color: #00a884;
    }

    .back-btn {
      color: #aebac1;
      font-size: 18px;
      cursor: pointer;
    }

    .chat-user-title {
      font-size: 16px;
      font-weight: 600;
      color: #e9edef;
    }

    .header-icons {
      display: flex;
      gap: 20px;
      color: #aebac1;
      font-size: 18px;
    }

    .header-icons i {
      cursor: pointer;
    }

    /* VISTA CONTATTI */
    .contacts-list {
      flex: 1;
      overflow-y: auto;
      background-color: #111b21;
    }

    .contact {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-bottom: 1px solid #222d34;
      cursor: pointer;
    }

    .contact:active {
      background-color: #202c33;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      font-size: 15px;
      margin-right: 15px;
      flex-shrink: 0;
    }

    .contact-info {
      flex: 1;
      overflow: hidden;
    }

    .contact-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .contact-name {
      font-weight: 600;
      color: #e9edef;
      font-size: 16px;
    }

    .contact-time {
      font-size: 12px;
      color: #8696a0;
    }

    .contact-msg {
      font-size: 13px;
      color: #8696a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* VISTA CHAT */
    .chat-container {
      flex: 1;
      display: none;
      flex-direction: column;
      height: calc(100vh - 60px);
      background-color: #0b141a;
      background-image: radial-gradient(#202c33 1px, transparent 0);
      background-size: 20px 20px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-wrap: break-word;
    }

    .msg.sent {
      background-color: #005c4b;
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .msg.received {
      background-color: #202c33;
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    .msg-time {
      font-size: 10px;
      color: #8696a0;
      text-align: right;
      margin-top: 3px;
    }

    /* BARRA INPUT MESSAGGI */
    .input-bar {
      background-color: #202c33;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 60px;
    }

    .input-bar input {
      flex: 1;
      background: #2a3942;
      border: none;
      padding: 10px 15px;
      border-radius: 20px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .send-btn {
      color: #00a884;
      font-size: 20px;
      cursor: pointer;
      padding: 5px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Header -->
  <div class="header-bar">
    <div class="header-left">
      <i class="fa-solid fa-arrow-left back-btn" id="backBtn" style="display:none;" onclick="goHome()"></i>
      <span class="app-title" id="appTitle">Chat</span>
      <span class="chat-user-title" id="chatTitle" style="display:none;"></span>
    </div>

    <div class="header-icons" id="mainIcons">
      <i class="fa-solid fa-magnifying-glass"></i>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
    <div class="header-icons" id="chatIcons" style="display:none;">
      <i class="fa-solid fa-video"></i>
      <i class="fa-solid fa-phone"></i>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
  </div>

  <!-- Lista Contatti -->
  <div class="contacts-list" id="contactsView"></div>

  <!-- Finestra Chat -->
  <div class="chat-container" id="chatView">
    <div class="chat-messages" id="messagesArea"></div>
    <div class="input-bar">
      <i class="fa-regular fa-face-smile" style="color:#8696a0; font-size:20px;"></i>
      <input type="text" id="msgInput" placeholder="Messaggio" onkeypress="handleKeyPress(event)">
      <i class="fa-solid fa-paper-plane send-btn" onclick="sendMsg()"></i>
    </div>
  </div>
</div>

<script>

        { text: "Grazie per oggi!", time: "20:45", type: "received" },

        { text: "Ah capito! Figurati, di niente.", time: "21:10", type: "sent" },
        { text: "Sì, esatto.", time: "21:12", type: "received" }
      ]
    },
    marco: {
      name: "Marco",
      avatar: "M",
      bg: "#2e7d32",
      time: "18:30",
      messages: [
        { text: "Ciao! Hai visto gli appunti di oggi?", time: "17:00", type: "received" },
        { text: "Non ancora, mi passi la foto?", time: "17:05", type: "sent" },
        { text: "Certo, te la mando tra poco.", time: "17:10", type: "received" },
        { text: "Hai fatto anche gli esercizi per domani?", time: "17:15", type: "received" },
        { text: "Sì, quelli di pagina 45 fatti tutti.", time: "17:20", type: "sent" },
        { text: "Erano difficili?", time: "17:22", type: "received" },
        { text: "Un po' il terzo, gli altri fattibili.", time: "17:25", type: "sent" },
        { text: "Ok grazie, stasera ci provo.", time: "17:30", type: "received" },
        { text: "Se ti blocchi fammi un fischio.", time: "17:35", type: "sent" },
        { text: "Ci vediamo domani!", time: "18:30", type: "received" }
      ]
    },
    sofia: {
      name: "Sofia",
      avatar: "S",
      bg: "#8e24aa",
      time: "17:45",
      messages: [
        { text: "Ehi! Vieni in biblioteca oggi?", time: "15:00", type: "received" },
        { text: "Verso che ora?", time: "15:10", type: "sent" },
        { text: "Noi siamo già qui al secondo piano.", time: "15:15", type: "received" },
        { text: "Arrivo tra una mezz'ora!", time: "15:20", type: "sent" },
        { text: "Porta anche il libro di storia.", time: "15:25", type: "received" },
        { text: "Sì ce l'ho nello zaino.", time: "15:30", type: "sent" },
        { text: "Perfetto, ci sono anche Luca ed Elena.", time: "15:35", type: "received" },
        { text: "Ottimo, ci vediamo dopo allora.", time: "15:40", type: "sent" },
        { text: "A dopo!", time: "17:45", type: "received" }
      ]
    },
    alessandro: {
      name: "Alessandro",
      avatar: "A",
      bg: "#d32f2f",
      time: "16:20",
      messages: [
        { text: "Stasera partita?", time: "14:00", type: "received" },
        { text: "Dove e a che ora?", time: "14:15", type: "sent" },
        { text: "Al solito campo sintetiche, ore 20:00.", time: "14:20", type: "received" },
        { text: "Manca ancora qualcuno?", time: "14:30", type: "sent" },

        { text: "Chiedo a Matteo se vuole venire.", time: "14:40", type: "sent" },
        { text: "Grande, fammi sapere!", time: "14:45", type: "received" },
        { text: "Ha detto di sì, viene con me.", time: "15:50", type: "sent" },
        { text: "Spettacolo, campo prenotato!", time: "16:20", type: "received" }
      ]
    },
    elena: {
      name: "Elena",
      avatar: "E",
      bg: "#f57c00",
      time: "15:10",
      messages: [
        { text: "Hai poi comprato quei pennarelli?", time: "14:50", type: "received" },
        { text: "Sì, presi stamattina in cartoleria.", time: "14:55", type: "sent" },
        { text: "Quanto li hai pagati?", time: "15:00", type: "received" },
        { text: "Circa 5 euro la confezione da 12.", time: "15:05", type: "sent" },

    },
    luca: {
      name: "Luca",
      avatar: "L",
      bg: "#0097a7",
      time: "14:00",

        { text: "A che ora parte il bus?", time: "13:30", type: "received" },

      name: "Giulia",

    davide: {
      name: "Davide",

        { text: "Hai visto il finale della serie?", time: "22:00", type: "received" },
        { text: "Non spoilerare!! Devo ancora guardare gli ultimi due episodi.", time: "22:05", type: "sent" },
        { text: "Tranquillo non dico nulla, ma puntatone!", time: "22:10", type: "received" },
        { text: "Stasera li guardo sicuramente.", time: "22:15", type: "sent" }
      ]
    },
    chiara: {
      name: "Chiara",
      avatar: "C",
      bg: "#00796b",
      time: "05/08",
      messages: [
        { text: "Ti va di fare due tiri a scacchi su Chess.com?", time: "16:00", type: "received" },
        { text: "Mandami la sfida!", time: "16:05", type: "sent" },
        { text: "Inviata, accetta quando ci sei.", time: "16:10", type: "received" },
        { text: "Entrato adesso!", time: "16:12", type: "sent" }
      ]
    },
    matteo: {
      name: "Matteo",
      avatar: "M",
      bg: "#455a64",
      time: "03/08",
      messages: [
        { text: "Sei riuscito a risolvere quel problema di codice?", time: "11:00", type: "received" },
        { text: "Sì, mancava un tag di chiusura!", time: "11:15", type: "sent" },
        { text: "Aha tipico errore di distrazione!", time: "11:20", type: "received" },
        { text: "Eh sì, capita spesso quando si scrive veloce.", time: "11:25", type: "sent" }
      ]
    }
  };

  function renderContacts() {
    const list = document.getElementById("contactsView");
    list.innerHTML = "";
    
    Object.keys(chatData).forEach(key => {
      const c = chatData[key];
      const lastMsg = c.messages[c.messages.length - 1].text;
      
      const div = document.createElement("div");
      div.className = "contact";
      div.onclick = () => openChat(key);
      div.innerHTML = `
        <div class="avatar" style="background:${c.bg}">${c.avatar}</div>
        <div class="contact-info">
          <div class="contact-top">
            <span class="contact-name">${c.name}</span>
            <span class="contact-time">${c.time}</span>
          </div>
          <div class="contact-msg">${lastMsg}</div>
        </div>
      `;
      list.appendChild(div);
    });
  }

  function openChat(key) {
    activeKey = key;
    const c = chatData[key];
    
    document.getElementById("contactsView").style.display = "none";
    document.getElementById("chatView").style.display = "flex";
    
    document.getElementById("appTitle").style.display = "none";
    document.getElementById("chatTitle").style.display = "inline";
    document.getElementById("chatTitle").innerText = c.name;
    
    document.getElementById("backBtn").style.display = "block";
    document.getElementById("mainIcons").style.display = "none";
    document.getElementById("chatIcons").style.display = "flex";

    renderMessages();
  }

  function renderMessages() {
    if (!activeKey) return;
    const area = document.getElementById("messagesArea");
    area.innerHTML = "";
    
    chatData[activeKey].messages.forEach(m => {
      const div = document.createElement("div");
      div.className = `msg ${m.type}`;
      div.innerHTML = `${m.text} <div class="msg-time">${m.time}</div>`;
      area.appendChild(div);
    });

    area.scrollTop = area.scrollHeight;
  }

  function goHome() {
    activeKey = null;
    document.getElementById("contactsView").style.display = "block";
    document.getElementById("chatView").style.display = "none";
    
    document.getElementById("appTitle").style.display = "inline";
    document.getElementById("chatTitle").style.display = "none";
    
    document.getElementById("backBtn").style.display = "none";
    document.getElementById("mainIcons").style.display = "flex";
    document.getElementById("chatIcons").style.display = "none";

    renderContacts();
  }

  function sendMsg() {
    const input = document.getElementById("msgInput");
    const val = input.value.trim();
    if (val !== "" && activeKey) {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      
      chatData[activeKey].messages.push({
        text: val,
        time: timeStr,
        type: "sent"
      });

      input.value = "";
      renderMessages();
    }
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') {
      sendMsg();
    }
  }

  // Inizializza lista contatti all'avvio
  renderContacts();
</script>
</body>
</html>
