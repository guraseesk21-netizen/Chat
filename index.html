<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      background-color: #0b141a;
      color: #e9edef;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* BARRA SUPERIORE */
    .app-header {
      background-color: #202c33;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: #aebac1;
      font-size: 18px;
      cursor: pointer;
      display: none; /* Nascosto nella vista contatti */
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #6b7c85;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
    }

    .user-info .name {
      font-weight: 600;
      font-size: 16px;
    }

    .user-info .status {
      font-size: 12px;
      color: #8696a0;
    }

    /* VISTA LISTA CONTATTI */
    .contacts-view {
      flex: 1;
      overflow-y: auto;
      background-color: #111b21;
    }

    .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 15px;
      border-bottom: 1px solid #222d34;
      cursor: pointer;
    }

    .contact-item:active {
      background-color: #202c33;
    }

    .contact-details {
      flex: 1;
    }

    .contact-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .contact-name {
      font-weight: 600;
      color: #e9edef;
    }

    .contact-time {
      font-size: 12px;
      color: #8696a0;
    }

    .contact-last-msg {
      font-size: 14px;
      color: #8696a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
    }

    /* VISTA CHAT */
    .chat-view {
      flex: 1;
      display: none; /* Nascosta di default */
      flex-direction: column;
      background-color: #0b141a;
      background-image: radial-gradient(#202c33 1px, transparent 0);
      background-size: 20px 20px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.4;
      position: relative;
    }

    .msg.received {
      background-color: #202c33;
      align-self: flex-start;
      border-top-left-radius: 0;
    }

    .msg.sent {
      background-color: #005c4b;
      align-self: flex-end;
      border-top-right-radius: 0;
    }

    .msg-time {
      font-size: 10px;
      color: #8696a0;
      text-align: right;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="app-header">
      <div class="header-left">
        <button class="back-btn" id="backBtn" onclick="showContacts()"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="avatar" id="headerAvatar">WA</div>
        <div class="user-info">
          <div class="name" id="headerTitle">WhatsApp</div>
          <div class="status" id="headerStatus"></div>
        </div>
      </div>
    </div>

    <!-- Lista Contatti -->
    <div class="contacts-view" id="contactsView">
      <div class="contact-item" onclick="openChat('koharu')">
        <div class="avatar">KF</div>
        <div class="contact-details">
          <div class="contact-top">
            <span class="contact-name">Koharu Fuyutsuki</span>
            <span class="contact-time">21:12</span>
          </div>
          <div class="contact-last-msg">Sì, esatto</div>
        </div>
      </div>

      <div class="contact-item" onclick="openChat('marco')">
        <div class="avatar">M</div>
        <div class="contact-details">
          <div class="contact-top">
            <span class="contact-name">Marco</span>
            <span class="contact-time">18:30</span>
          </div>
          <div class="contact-last-msg">Ci vediamo più tardi!</div>
        </div>
      </div>
    </div>

    <!-- Schermata Chat -->
    <div class="chat-view" id="chatView">
      <div class="chat-messages" id="chatMessages"></div>
    </div>
  </div>

  <script>
    const chatData = {
      koharu: {
        name: "Koharu Fuyutsuki",
        avatar: "KF",
        status: "online",
        messages: [
          { text: "Grazie per oggi!", time: "20:45", type: "received" },
          { text: "Di cosa parli?", time: "21:00", type: "sent" },
          { text: "Sì, esatto", time: "21:12", type: "received" }
        ]
      },
      marco: {
        name: "Marco",
        avatar: "M",
        status: "ultimo accesso oggi alle 18:35",
        messages: [
          { text: "Ciao, hai finito il progetto?", time: "18:25", type: "received" },
          { text: "Sì, ho appena caricato i file!", time: "18:28", type: "sent" },
          { text: "Ci vediamo più tardi!", time: "18:30", type: "received" }
        ]
      }
    };

    function openChat(contactKey) {
      const contact = chatData[contactKey];
      
      // Aggiorna Header
      document.getElementById("headerTitle").innerText = contact.name;
      document.getElementById("headerAvatar").innerText = contact.avatar;
      document.getElementById("headerStatus").innerText = contact.status;
      document.getElementById("backBtn").style.display = "block";

      // Mostra i messaggi
      const messagesContainer = document.getElementById("chatMessages");
      messagesContainer.innerHTML = "";
      
      contact.messages.forEach(msg => {
        const div = document.createElement("div");
        div.className = `msg ${msg.type}`;
        div.innerHTML = `${msg.text} <div class="msg-time">${msg.time}</div>`;
        messagesContainer.appendChild(div);
      });

      // Passa alla vista Chat
      document.getElementById("contactsView").style.display = "none";
      document.getElementById("chatView").style.display = "flex";
    }

    function showContacts() {
      // Ripristina Header Principale
      document.getElementById("headerTitle").innerText = "WhatsApp";
      document.getElementById("headerAvatar").innerText = "WA";
      document.getElementById("headerStatus").innerText = "";
      document.getElementById("backBtn").style.display = "none";

      // Passa alla vista Contatti
      document.getElementById("chatView").style.display = "none";
      document.getElementById("contactsView").style.display = "block";
    }
  </script>
</body>
</html>
